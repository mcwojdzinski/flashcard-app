<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3">
  @for (toast of toasts(); track toast.id) {
    <div
      class="py-3 px-6 rounded-full border-2 border-neutral-900 bg-neutral-0 shadow-[2px_2px_0_0_rgba(46,20,1,1)] flex items-center justify-between gap-4 animate-slide-in"
      [ngClass]="{
        'text-green-700': toast.type === 'success',
        'text-pink-700': toast.type === 'error',
        'text-blue-600': toast.type === 'info',
      }"
    >
      <p class="tp4-medium">{{ toast.message }}</p>
      <button
        (click)="removeToast(toast.id)"
        class="hover:cursor-pointer border-none bg-none flex items-center justify-center"
      >
        <img src="/icon-cross.svg" alt="Close icon" />
      </button>
    </div>
  }
</div>
