@if (type() === 'primary') {
  <button
    [ngClass]="{ 'opacity-50 hover:shadow-input! hover:cursor-not-allowed!': isDisabled() }"
    class="flex flex-row gap-2 py-3 px-5 bg-yellow-500 rounded-full border-neutral-900 border text-neutral-900 tp4-medium shadow-[2px_2px_0_0_var(--color-neutral-900)] hover:shadow-[4px_4px_0_0_var(--color-neutral-900)] hover:cursor-pointer transition focus:shadow-[3px_3px_0_0_var(--color-blue-600)] outline-none"
    [disabled]="isDisabled()"
  >
    <img src="{{ icon() }}" /> {{ text() }}
  </button>
} @else if (type() === 'secondary') {
  <button
    class="flex flex-row gap-2 py-3 px-5 bg-neutral-0 rounded-full border-neutral-900 border text-neutral-900 tp4-medium shadow-[2px_2px_0_0_var(--color-neutral-900)] hover:shadow-[4px_4px_0_0_var(--color-neutral-900)] hover:cursor-pointer transition focus:shadow-[3px_3px_0_0_var(--color-blue-600)] outline-none"
  >
    <img src="{{ icon() }}" /> {{ text() }}
  </button>
} @else {
  <button
    class="flex flex-row gap-2 py-3 px-5 bg-neutral-0 rounded-full border-neutral-900 border text-neutral-900 tp4-medium hover:cursor-pointer transition hover:bg-neutral-100"
  >
    <img src="{{ icon() }}" /> {{ text() }} <img src="{{ iconSecond() }}" />
  </button>
}
