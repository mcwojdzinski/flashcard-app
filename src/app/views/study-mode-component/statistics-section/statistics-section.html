<div class="p-6 bg-neutral-0 border border-neutral-900 border-r-[3px] border-b-[3px] rounded-2xl">
  <h2 class="tp2 text-neutral-900 mb-4">Study Statistics</h2>
  <div
    class="flex flex-col sm:grid sm:grid-cols-2 sm:flex-row sm:flex-wrap justify-items-stretch lg:flex lg:flex-col gap-5"
  >
    <app-statistics-card
      cardTitle="Total Cards"
      [cardCount]="0"
      [cardBackground]="Background.blue"
      [icon]="Icon.total"
    />
    <app-statistics-card
      cardTitle="Mastered"
      [cardCount]="0"
      [cardBackground]="Background.teal"
      [icon]="Icon.mastered"
    />
    <app-statistics-card
      cardTitle="In Progress"
      [cardCount]="0"
      [cardBackground]="Background.pink"
      [icon]="Icon.inProgress"
    />
    <app-statistics-card
      cardTitle="Not Started"
      [cardCount]="0"
      [cardBackground]="Background.lightPink"
      [icon]="Icon.notStarted"
    />
  </div>
</div>
